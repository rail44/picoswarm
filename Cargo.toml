[package]
name = "picoswarm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "pswarm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "=4.6.3", features = ["unstable-dynamic"] }
crossterm = "0.29.0"
daemonize = "0.5.0"
directories = "6.0.0"
nix = { version = "0.31.2", features = ["signal"] }
pty-process = "=0.5.3"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.38.1", default-features = false, features = ["system"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "signal", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic/nursery lints that are mostly noise for a solo CLI.
significant_drop_tightening = "allow"  # locks intentionally held for full method scope
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
single_match_else = "allow"
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
ignored_unit_patterns = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

# Restriction lints we opt into for app code. tests/*.rs override
# unwrap_used / expect_used / panic at the file level.
let_underscore_must_use = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
redundant_clone = "warn"
