[package]
name = "picoswarm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "pswarm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
# Pinned: `unstable-dynamic` is the only API channel for runtime
# completion (issue #13). Pin to a known-good version and re-test
# on intentional bumps; the API has been stable since 4.5.31 (2024-10)
# but the `unstable-` prefix means breaking changes can land in any
# minor release.
clap_complete = { version = "=4.6.3", features = ["unstable-dynamic"] }
crossterm = "0.29.0"
daemonize = "0.5.0"
directories = "6.0.0"
nix = { version = "0.31.2", features = ["signal"] }
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "signal", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
